name: Build and push Docker image
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        run: |
          docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Build image
        run: |
          docker build -t mevipulsingh/flask-app:latest .

      - name: Push image 
        run: |
          docker push mevipulsingh/flask-app:latest